---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: engenox-dev-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: engenox-dev-apps
    app.kubernetes.io/part-of: engenox
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: engenox
  source:
    repoURL: https://github.com/xpixenoxx/engenox.git
    targetRevision: main
    path: infra/kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: engenox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image

