---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: engenox-stage-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: engenox-stage-apps
    app.kubernetes.io/part-of: engenox
    environment: stage
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: engenox
  source:
    repoURL: https://github.com/pixenox/engenox.git
    targetRevision: main
    path: infra/kustomize/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: engenox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncWindows:
    - kind: allow
      schedule: "0 3 * * 1-5"  # Weekdays 3 AM UTC
      duration: 2h
      manualSync: true

