# infra/argocd/applications/stage.yaml — Argo CD Applications for engenox stage environment
# Apply: kubectl apply -f infra/argocd/applications/stage.yaml

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: engenox-stage-infra
  namespace: argocd
  labels:
    app.kubernetes.io/name: engenox-stage-infra
    app.kubernetes.io/part-of: engenox
    environment: stage
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: engenox
  source:
    repoURL: https://github.com/pixenox/engenox.git
    targetRevision: main
    path: infra/kustomize/overlays/stage/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: engenox-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  syncWindows:
    - kind: allow
      schedule: "0 2 * * 1-5"  # Weekdays 2 AM UTC
      duration: 2h
      manualSync: false

