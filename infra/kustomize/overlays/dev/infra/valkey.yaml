# infra/kustomize/overlays/dev/infra/valkey.yaml
# Memorystore for Valkey 9.0 (GCP-native) - using self-managed for dev parity

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: engenox-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: engenox
    environment: dev
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: engenox
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0
          ports:
            - containerPort: 6379
              name: valkey
          command:
            - valkey-server
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --maxmemory
            - 2gb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "yes"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: valkey-password
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["valkey-cli", "-a", "$(VALKEY_PASSWORD)", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["valkey-cli", "-a", "$(VALKEY_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: engenox-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: engenox
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: valkey
  selector:
    app.kubernetes.io/name: valkey
  clusterIP: None

---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey
  namespace: monitoring
  labels:
    app.kubernetes.io/name: valkey
spec:
  endpoints:
    - port: valkey
      path: /metrics
      interval: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  namespaceSelector:
    matchNames:
      - engenox-system