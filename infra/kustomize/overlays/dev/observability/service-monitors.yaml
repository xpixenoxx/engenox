# infra/kustomize/overlays/dev/observability/service-monitors.yaml
# ServiceMonitors for Prometheus Operator / Mimir scraping

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: engenox-services
  namespace: monitoring
  labels:
    release: mimir
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: engenox
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scheme: http
  namespaceSelector:
    matchNames:
      - engenox
      - engenox-system



---
