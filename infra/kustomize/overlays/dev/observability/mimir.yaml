# infra/kustomize/overlays/dev/observability/mimir.yaml
# Grafana Mimir - metrics storage (replaces Prometheus for long-term storage)

apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    target: all,alertmanager
    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
    memberlist:
      join_members: ["mimir-memberlist.monitoring.svc.cluster.local"]
    ingester:
      replication_factor: 1
      ring:
        final_sleep: 0s
        num_tokens: 512
    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler
    limits:
      ingestion_rate: 100000
      ingestion_burst_size: 200000
      global:
        ingestion_rate: 100000
        ingestion_burst_size: 200000

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: monitoring
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: mimir
          image: grafana/mimir:2.9.0
          args:
            - -config.file=/etc/mimir/mimir.yaml
          ports:
            - containerPort: 9009
              name: http
            - containerPort: 9095
              name: grpc
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
spec:
  ports:
    - port: 9009
      targetPort: 9009
      name: http
    - port: 9095
      targetPort: 9095
      name: grpc
  selector:
    app: mimir

---
apiVersion: v1
kind: Service
metadata:
  name: mimir-memberlist
  namespace: monitoring
spec:
  clusterIP: None
  ports:
    - port: 7946
      targetPort: 7946
      name: memberlist
  selector:
    app: mimir