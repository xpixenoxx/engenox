apiVersion: apps/v1
kind: Deployment
metadata:
  name: engenox-gateway
  namespace: engenox
  labels:
    app: engenox-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engenox-gateway
  template:
    metadata:
      labels:
        app: engenox-gateway
    spec:
      serviceAccountName: engenox-workload
      containers:
        - name: gateway
          image: us-central1-docker.pkg.dev/engenox-stage/services/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: TENANT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10