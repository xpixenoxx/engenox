apiVersion: apps/v1
kind: Deployment
metadata:
  name: engenox-control-plane
  namespace: engenox
  labels:
    app: engenox-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engenox-control-plane
  template:
    metadata:
      labels:
        app: engenox-control-plane
    spec:
      serviceAccountName: engenox-workload
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "database"
          effect: "NoSchedule"
      containers:
        - name: control-plane
          image: us-central1-docker.pkg.dev/engenox-stage/services/control-plane:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: engenox-config
            - secretRef:
                name: engenox-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8081"
            - name: TENANT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
