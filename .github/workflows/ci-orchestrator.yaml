# ci-orchestrator.yaml — the SINGLE ENTRY for the gate chain (M7 extended).
#
# GitHub Actions has no native cross-workflow `needs:` — the gate-order is expressed by making each
# gate a REUSABLE workflow (`on: workflow_call`) called from THIS orchestrator in `needs:` order:
#   contract-gate (the root, no needs)  →  lint / tests / dependency-direction / security-scan /
#   stack-drift-watchdog / M7-stage-deploy / M7-atlascycle-e2e / M7-warm-canary / M7-concierge-smoke /
#   M7-reconciliation / M7-r2-restore  (each `needs: contract-gate`, run in parallel)  →
#   gate-status  (needs ALL; `if: always()`; the single merge-or-block candor-floor status).
#
# M7 jobs run on `main` only (not PRs) + scheduled for warm-canary.
# The contract gate is the FIRST gate, always — the architecture's #1 anti-rework discipline
# (CLAUDE.md §4) is enforced by making the contract compile + buf breaking the gate every other
# gate waits on. If the contracts don't compile, nothing else runs (T06 §Notes).
# `gate-status` is the branch-protection required check: pass/fail, no "substantially done"
# middle state (the candor floor in CI, CLAUDE.md §12 + DEFINITION_OF_DONE.md).
#
# Cites: 25 §3; 17 §4 (the CI gate chain); 24 §8 (nx-targeted CI, post-M0); CLAUDE.md §7 (§the chain) +
#        §12 (candor floor); T06 (the orchestrator + gate-status); M7 T01–T07; ADR-0007.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 2 * * *"  # daily 02:07 UTC for warm-canary (off :00 per CLAUDE.md §6)

permissions:
  contents: read

# Reusable workflows run on the caller's runner context; secrets + GITHUB_TOKEN are inherited.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    uses: ./.github/workflows/contract-gate.yaml
    # the root — NO `needs:` (asserted by tools/assert-gate-order.{sh,ps1}).

  lint:
    needs: contract-gate
    uses: ./.github/workflows/lint.yaml

  tests:
    needs: contract-gate
    uses: ./.github/workflows/tests.yaml

  e2e:
    needs: tests
    uses: ./.github/workflows/e2e.yaml

  dependency-direction:
    needs: contract-gate
    uses: ./.github/workflows/dependency-direction.yaml

  security-scan:
    needs: contract-gate
    uses: ./.github/workflows/security-scan.yaml
    secrets: inherit   # gitleaks reads secrets.GITHUB_TOKEN from the caller's context.

  stack-drift-watchdog:
    needs: contract-gate
    uses: ./.github/workflows/stack-drift-watchdog.yaml

  # =========================================================================
  # M7 jobs — run on main only (stage deployment + pilot validation)
  # =========================================================================

  stage-deploy:
    name: "Stage Cell Deploy"
    runs-on: ubuntu-latest
    needs: contract-gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup mise + tofu
        uses: ./.github/actions/setup-mise-tofu
      - name: Configure GCP ADC
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_STAGE_SA_KEY }}
      - name: Configure kubectl
        run: gcloud container clusters get-credentials engenox-primary-stage-gke --region=asia-south1
      - name: Apply stage cell (phase 1 - GCP resources)
        working-directory: infra/tofu/envs/stage/primary
        run: |
          mise exec -- tofu init
          mise exec -- tofu apply -auto-approve \
            -target=module.cell.google_container_cluster.primary \
            -target=module.cell.google_storage_bucket.pitr \
            -target=module.cell.google_kms_key_ring.cell \
            -target=module.cell.google_kms_crypto_key.kek \
            -target=module.cell.google_memorystore_instance.valkey \
            -target=module.r2_corpus.cloudflare_r2_bucket.corpus \
            -target=module.r2_corpus.cloudflare_worker_script.auth_proxy
      - name: Apply stage cell (phase 2 - K8s manifests)
        working-directory: infra/tofu/envs/stage/primary
        run: mise exec -- tofu apply -auto-approve

  atlascycle-e2e-stage:
    name: "AtlasCycle E2E Stage"
    runs-on: ubuntu-latest
    needs: stage-deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup mise
        uses: ./.github/actions/setup-mise
      - name: Seed fixtures
        run: |
          mise exec -- atlas migrate apply --dir file://libs/kg/migrations/atlas
          mise exec -- python scripts/seed-consent-stage.py --env=stage
          mise exec -- python scripts/seed-conflict-stage.py --tenant=pilot-tenant-001 --surface=chatgpt
      - name: Trigger AtlasCycle
        run: |
          curl -X POST https://stage.api.engenox.dev/v1/atlas-cycle/start \
            -H "Authorization: Bearer ${{ secrets.WORKOS_STAGE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"tenant_id": "pilot-tenant-001", "surfaces": ["chatgpt", "perplexity", "gemini"]}'
      - name: Wait + Verify
        run: python scripts/wait_atlas_cycle.py --tenant=pilot-tenant-001 --timeout=600
      - name: Verify Corpus Row
        run: python scripts/verify_corpus_row.py --tenant=pilot-tenant-001 --env=stage

  warm-canary-divergence:
    name: "Warm-Canary Divergence (48h)"
    runs-on: ubuntu-latest
    needs: contract-gate
    if: github.event_name == 'schedule'  # daily scheduled only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup mise
        uses: ./.github/actions/setup-mise
      - name: Query 48h divergence
        run: python scripts/check_warm_canary_divergence.py --hours=48 --threshold=0.15

  concierge-pilot-smoke:
    name: "Concierge Pilot Smoke"
    runs-on: ubuntu-latest
    needs: atlascycle-e2e-stage
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup mise
        uses: ./.github/actions/setup-mise
      - name: Onboard test pilot tenant
        run: |
          python scripts/onboard_concierge_tenant.py \
            --tenant=smoke-test-tenant \
            --email=founder+smoke@engenox.dev \
            --surfaces=chatgpt,perplexity,gemini
      - name: Wait for first cycle
        run: python scripts/wait_atlas_cycle.py --tenant=smoke-test-tenant --timeout=900
      - name: Verify PR opened
        run: python scripts/verify_action_pr.py --tenant=smoke-test-tenant --dial-level=propose

  reconciliation-test:
    name: "Three-Sinks Reconciliation"
    runs-on: ubuntu-latest
    needs: contract-gate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup mise
        uses: ./.github/actions/setup-mise
      - name: Run reconciliation fixture test
        run: |
          cd services/measurement
          uv run pytest src/engenox/measurement/__tests__/test_reconciliation.py -xvs

  r2-restore-test:
    name: "R2 WORM Restore Test"
    runs-on: ubuntu-latest
    needs: contract-gate
    if: env.R2_TEST_ENDPOINT != ''
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup mise
        uses: ./.github/actions/setup-mise
      - name: Run R2 restore fixture test
        run: |
          cd services/measurement
          uv run pytest src/engenox/measurement/__tests__/test_r2_restore.py -xvs
        env:
          R2_TEST_ENDPOINT: ${{ secrets.R2_TEST_ENDPOINT }}
          R2_TEST_ACCESS_KEY: ${{ secrets.R2_TEST_ACCESS_KEY }}
          R2_TEST_SECRET_KEY: ${{ secrets.R2_TEST_SECRET_KEY }}

  # =========================================================================
  # GATE STATUS — the candor-floor aggregate
  # =========================================================================
  gate-status:
    name: "Gate Status"
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
      - e2e
      - dependency-direction
      - security-scan
      - stack-drift-watchdog
      # M7 jobs (conditional)
      - stage-deploy
      - atlascycle-e2e-stage
      - warm-canary-divergence
      - concierge-pilot-smoke
      - reconciliation-test
      - r2-restore-test
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          set -u
          fail=0
          check () {
            local g="$1" r="$2"
            printf '%-30s %s\n' "$g" "$r"
            if [ "$r" != "success" ]; then
              fail=1
            fi
          }
          check contract-gate           "${{ needs.contract-gate.result }}"
          check lint                    "${{ needs.lint.result }}"
          check tests                   "${{ needs.tests.result }}"
          check e2e                     "${{ needs.e2e.result }}"
          check dependency-direction    "${{ needs.dependency-direction.result }}"
          check security-scan           "${{ needs.security-scan.result }}"
          check stack-drift-watchdog     "${{ needs.stack-drift-watchdog.result }}"
          # M7 jobs
          check stage-deploy            "${{ needs.stage-deploy.result }}"
          check atlascycle-e2e-stage    "${{ needs.atlascycle-e2e-stage.result }}"
          check warm-canary-divergence  "${{ needs.warm-canary-divergence.result }}"
          check concierge-pilot-smoke   "${{ needs.concierge-pilot-smoke.result }}"
          check reconciliation-test     "${{ needs.reconciliation-test.result }}"
          check r2-restore-test         "${{ needs.r2-restore-test.result }}"
          echo "---"
          if [ "$fail" -eq 1 ]; then
            echo "GATE STATUS: BLOCKED — one or more gates are not success (a skipped downstream gate is a block)"
            exit 1
          fi
          echo "GATE STATUS: MERGEABLE — all required gates success"