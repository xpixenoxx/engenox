# nginx.dev.conf — Reverse proxy for local Engenox development
# Maps: localhost/* -> appropriate internal service

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstreams (internal service names)
    upstream gateway {
        server engenox-gateway:8080;
    }
    upstream perception {
        server engenox-perception:8081;
    }
    upstream action {
        server engenox-action:8082;
    }
    upstream measurement {
        server engenox-measurement:8083;
    }
    upstream control-plane {
        server engenox-control-plane:8084;
    }
    upstream decision {
        server engenox-decision:8085;
    }
    upstream temporal-ui {
        server engenox-temporal-ui:8080;
    }
    upstream grafana {
        server engenox-grafana:3000;
    }
    upstream langfuse {
        server engenox-langfuse:3000;
    }
    upstream minio-console {
        server engenox-minio:9001;
    }
    upstream clickhouse {
        server engenox-clickhouse:8123;
    }

    # HTTP -> HTTPS redirect (optional for local)
    server {
        listen 80;
        server_name localhost;

        # API routes
        location /api/gateway/ {
            proxy_pass http://gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/perception/ {
            proxy_pass http://perception/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/action/ {
            proxy_pass http://action/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/measurement/ {
            proxy_pass http://measurement/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/control-plane/ {
            proxy_pass http://control-plane/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/decision/ {
            proxy_pass http://decision/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Temporal UI
        location /temporal/ {
            proxy_pass http://temporal-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Langfuse
        location /langfuse/ {
            proxy_pass http://langfuse/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO Console
        location /minio/ {
            proxy_pass http://minio-console/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ClickHouse
        location /clickhouse/ {
            proxy_pass http://clickhouse/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # HTTPS (optional - requires cert generation)
    # server {
    #     listen 443 ssl;
    #     server_name localhost;
    #     ssl_certificate /etc/nginx/certs/localhost.crt;
    #     ssl_certificate_key /etc/nginx/certs/localhost.key;
    #     # ... same location blocks
    # }
}