receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'mimir'
          static_configs:
            - targets: ['mimir:9010']
        - job_name: 'loki'
          static_configs:
            - targets: ['loki:3100']
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']

exporters:
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: "engenox"

  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp, prometheus]
      exporters: [prometheusremotewrite, debug]
    logs:
      receivers: [otlp]
      exporters: [loki, debug]