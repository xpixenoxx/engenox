# mimir-config.yaml — Mimir config for local dev
auth_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9010

distributor:
  ha_tracker:
    enable_ha_tracker: false

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1
  max_transfer_retries: 0

store:
  backend: filesystem
  filesystem:
    dir: /data/mimir/tsdb

schema:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  ingestion_per_tenant_ingestion_rate_unlimited: true
  ingestion_per_tenant_ingestion_burst_size_unlimited: true

compactor:
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m
  retention_period: 168h

analytics:
  reporting_enabled: false