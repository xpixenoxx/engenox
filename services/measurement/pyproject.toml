[project]
name = "engenox-measurement"
version = "0.1.0"
description = "Engenox Measurement Service — M4-thin: SCM + DML + placeholder conformal + EWMA/CUSUM foreign-change detector + signed CIO corpus row"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "clickhouse-connect>=0.8.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.6.0",
    "orjson>=3.10.0",
    "cryptography>=44.0.0",
    "ruff>=0.15.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "ruff>=0.15.0",
    "mypy>=1.13.0",
    "pandas-stubs>=3.0.3.260530",
    "scipy-stubs>=1.18.0.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "ANN", "ARG", "PTH", "T20", "TD", "FA", "SIM"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002"]
per-file-ignores = { "__tests__/*" = ["S101", "S106", "D100", "D103"], "scripts/*" = ["S101", "S106"] }

[tool.ruff.lint.isort]
known-first-party = ["engenox"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
enable_error_code = ["ignore-without-code"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["__tests__"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["engenox*"]
