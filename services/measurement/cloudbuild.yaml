steps:
# Build and push measurement using Cloud Build Docker
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '--platform=linux/amd64'
    - '-t'
    - 'us-central1-docker.pkg.dev/engenox-stage/services/measurement:latest'
    - '-f'
    - 'services/measurement/Dockerfile'
    - '.'
images:
  - 'us-central1-docker.pkg.dev/engenox-stage/services/measurement:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'