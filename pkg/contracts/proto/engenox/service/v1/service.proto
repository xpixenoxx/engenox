// service.proto - the PerceptionService contract (24 §3).
//
// The reference shape for a cross-service call: services/control-plane calls
// services/perception only via the gRPC client Buf generates from this file.
// The control-plane NEVER calls a service's internal packages directly.
// M4-thin extends: ProbeSurface, FastPartialProbe, GetProbeHistory.

syntax = "proto3";

package engenox.service.v1;

import "engenox/entity/v1/entity.proto";
import "engenox/entity/v1/surface.proto";
import "engenox/event/v1/event.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/engenox/contracts/generated/go/engenox/service/v1;servicev1";

// The Perception service - the probe fleet's contract fan-in (24 §3).
// M4-thin: GSC connector + fast-partial probe + history.
service PerceptionService {
  // Writes a typed AssertedNode into the truth spine (06 §2.1) and returns the committed
  // event's id (the AssertionEvent.event_id, 14 §3). Idempotent on
  // (tenant_id, idempotency_key); a replay returns the same event_id and writes nothing
  // new.
  rpc Assert(AssertRequest) returns (AssertResponse);

  // M4-thin: Runs the GSC probe for a surface and extracts assertions (triggers Extract seam).
  rpc ProbeSurface(ProbeSurfaceRequest) returns (ProbeSurfaceResponse);

  // M4-thin: Fast-partial probe: returns early signal (<90s) for the onboarding activation.
  rpc FastPartialProbe(FastPartialProbeRequest) returns (FastPartialProbeResponse);

  // M4-thin: Gets the probe history for a surface.
  rpc GetProbeHistory(GetProbeHistoryRequest) returns (GetProbeHistoryResponse);
}

// The Assert request body. Wrapping the node in a request message (not taking the
// AssertedNode directly) is the forward-compatible gRPC shape: a field added later does
// not break the wire (14 §5 BACKWARD). idempotency_key is required on every mutating RPC
// (CLAUDE.md §8).
message AssertRequest {
  // The typed assertion to commit into the truth spine (06 §2.1). The service injects
  // node.tenant_id from the JWT (see the message comment above); a client-supplied
  // node.tenant_id is ignored.
  engenox.entity.v1.AssertedNode node = 1;
  // The Temporal key; a mutation without one is a watchdog hit (CLAUDE.md §8).
  string idempotency_key = 2;
}

// The Assert response (a trivial ack). Carries the event_id of the committed
// AssertionEvent (14 §3) so the caller can trace the write into the bus and the
// three-sinks reconciliation (14 §4).
message AssertResponse {
  // The id of the committed AssertionEvent (14 §3) - the idempotency key downstream.
  string event_id = 1;
}

// M4-thin: ProbeSurface request.
message ProbeSurfaceRequest {
  string tenant_id = 1;
  engenox.entity.v1.Surface surface = 2;
  string idempotency_key = 3;
}

// M4-thin: ProbeSurface response.
message ProbeSurfaceResponse {
  // The assertions extracted from the GSC response (via Extract seam).
  repeated engenox.event.v1.Assertion assertions = 1;
  // The raw GSC response metadata.
  string gsc_response_id = 2;
  google.protobuf.Timestamp probed_at = 3;
}

// M4-thin: FastPartialProbe request.
message FastPartialProbeRequest {
  string tenant_id = 1;
  engenox.entity.v1.Surface surface = 2;
  string idempotency_key = 3;
}

// M4-thin: FastPartialProbe response.
message FastPartialProbeResponse {
  // Early signal: has the surface appeared for the query? (boolean for F2 activation).
  bool has_presence = 1;
  // The estimated position/ranking if available.
  int32 estimated_position = 2;
  // The confidence in the fast-partial result (0..1).
  double confidence = 3;
  google.protobuf.Timestamp probed_at = 4;
}

// M4-thin: GetProbeHistory request.
message GetProbeHistoryRequest {
  string tenant_id = 1;
  string surface_id = 2;
  int32 limit = 3;
}

// M4-thin: GetProbeHistory response.
message GetProbeHistoryResponse {
  repeated ProbeSummary probes = 1;
}

message ProbeSummary {
  string probe_id = 1;
  google.protobuf.Timestamp probed_at = 2;
  int32 assertions_found = 3;
  bool fast_partial = 4;
}