# mise.toml — the pinned 2026 toolchain (the live form of ADR-0001).
# A version bump to any of these is an ADR (STACK_DRIFT_WATCHDOG.md category 1).
# mypy is pinned in pyproject.toml [tool.uv].dev-dependencies (it's a pip package, not a mise standalone).
[tools]
node = "22"           # Node 22 LTS ("Jod"); pnpm 11 requires Node 22+
pnpm = "11"           # ESM-first TS workspace manager
go = "1.24"           # range-over-func; the probe/action fleet
# the two Go codegen plugins buf's `local:` execs at gen time (ADR-0001; T02). Pinned via
# the aqua backend (prebuilt binaries — the `go:` backend fails for protoc-gen-go-grpc:
# google.golang.org/grpc/cmd/protoc-gen-go-grpc moved out of the grpc module at v1.68.0).
# A fresh clone's `mise install` provisions both from these pins; WITHOUT them the shims are
# merely PATH-resolved (whatever a prior install left) — `buf generate`'s Go step fails on
# a clean checkout. That §12 reproducibility hole is closed here (resolved from the
# buf.gen.yaml candor TODO). Bumping either is a category-1 stack-drift hit (CLAUDE.md §8).
#
# Version relationship (honest, NOT "== go.mod X.Y.Z" — the plugin semver and the runtime
# lib semver are independent lines): protoc-gen-go@1.36.11 releases aligned with the
# protobuf-go module, so it DOES == go.mod google.golang.org/protobuf v1.36.11. But
# protoc-gen-go-grpc has its OWN semver (1.2->1.6); go.mod grpc v1.68.0 is the RUNTIME the
# generated stubs import. The two need to be COMPATIBLE, not equal — and `go build ./...`
# green is the proof (the generated grpc stubs compile against grpc v1.68.0). The 1.6.2
# binary is what produced that green output, so 1.6.2 is the proven-compatible pin.
"aqua:protocolbuffers/protobuf-go/protoc-gen-go"   = "1.36.11"  # == go.mod google.golang.org/protobuf v1.36.11
"aqua:grpc/grpc-go/protoc-gen-go-grpc"             = "1.6.2"    # binary semver; compatible w/ go.mod grpc v1.68.0 (`go build` green)
python = "3.13"       # the measurement/causal tier (3.13 stable)
uv = "latest"         # the Python workspace + lock (fast-moving; mise resolves)
buf = "1.50"          # the contract codegen CLI (v1.x; the v2 FORMAT is T02's concern)
biome = "2"           # the TS/JSON linter+formatter (replaces ESLint+Prettier, 29 §6)
ruff = "0.15"         # the Python linter+formatter (standalone; also in pyproject dev-deps — must match)
golangci-lint = "2"  # the Go linter (v2 config; configs land at T11)
atlas = "0.30"        # the schema-as-code migration engine (still 0.x)
opentofu = "1.9"      # the IaC (29 §6)
"aqua:argoproj/argo-cd" = "2.13"      # the CD app-of-apps (29 §6)

[env]
# reserved — the contract-generated output (pkg/contracts/generated/) is git-ignored; codegen runs in CI (T02/T06)
